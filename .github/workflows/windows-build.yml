name: Windows build

# どのブランチを push しても、きれいなチェックアウトから EditorRelease の編集器と Launcher を作る。
# ランナーには GPU がないので、確かめるのは依存の復元・構成・コンパイルとリンクまで。
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-release:
    name: EditorRelease (Editor + Launcher)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore cached vcpkg trees
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            vcpkg_installed
            vcpkg_installed_static
          key: vcpkg-windows-2022-${{ hashFiles('vcpkg.json', 'Tools/Dependencies/vcpkg-static/vcpkg.json') }}

      - name: Install vcpkg trees
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # ランナー付属の vcpkg に固定基線のコミットがなければ、オブジェクトだけ取得する（作業ツリーは変えない）。
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C $vcpkgRoot cat-file -e "$baseline^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
              git -C $vcpkgRoot fetch --quiet origin
              if ($LASTEXITCODE -ne 0) { throw 'Fetching the vcpkg registry failed.' }
          }
          ./Tools/Dependencies/Restore-HikariDependencies.ps1 -VcpkgRoot $vcpkgRoot

      # 後の手順が失敗してもインストール済みの依存を次回へ残すため、入れた直後に保存する。
      - name: Save vcpkg trees
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            vcpkg_installed
            vcpkg_installed_static
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Restore WinPixEventRuntime
        shell: pwsh
        run: |
          # PIX の実行時ライブラリはリポジトリに入れていない。ロックと同じ版の NuGet パッケージから取り出し、
          # 次の手順でロックのハッシュと照合する。
          $lock = Get-Content Tools/Dependencies/HIKARI_ThirdParty.lock.json -Raw | ConvertFrom-Json
          $version = ($lock.dependencies | Where-Object name -eq 'WinPixEventRuntime').version
          $package = Join-Path $env:RUNNER_TEMP 'WinPixEventRuntime.zip'
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/WinPixEventRuntime/$version" -OutFile $package
          $extracted = Join-Path $env:RUNNER_TEMP 'WinPixEventRuntime'
          Expand-Archive -LiteralPath $package -DestinationPath $extracted -Force
          $target = 'ThirdParty/WinPixEventRuntime/bin/x64'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($name in 'WinPixEventRuntime.dll', 'WinPixEventRuntime.lib') {
              Copy-Item -LiteralPath (Join-Path $extracted "bin/x64/$name") -Destination $target
          }

      - name: Verify dependency snapshot
        shell: pwsh
        run: ./Tools/Dependencies/Test-HikariDependencySnapshot.ps1

      - name: Install CMake
        shell: pwsh
        run: |
          # Editor SDK は構築に使った CMake を同梱するので、公式配布物の並び（doc/cmake/LICENSE.rst を含む）が要る。
          # ランナー付属の CMake にはそれがないため、手元と同じ版の公式 zip を取り、公開されている SHA-256 と照合する。
          $version = '4.3.1'
          $sha256 = '03a610be931546474e46a442d171ef10532f4fc847de9cf76b7a8065bbef6a23'
          $name = "cmake-$version-windows-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$version/$name.zip" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $sha256) { throw "CMake $version archive hash differs." }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $root = Join-Path $env:RUNNER_TEMP $name
          if (-not (Test-Path -LiteralPath (Join-Path $root 'doc/cmake/LICENSE.rst'))) { throw "CMake $version archive has no doc/cmake/LICENSE.rst." }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $root 'bin')

      - name: Configure EditorRelease
        shell: pwsh
        run: |
          cmake --version
          cmake --preset editor-release

      - name: Build editor and launcher
        shell: pwsh
        run: cmake --build --preset editor-release -- /m /nologo /v:minimal
